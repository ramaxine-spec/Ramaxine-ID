<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ramaxine — Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px 40px;
            font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            padding: 28px 20px 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 2px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0a1a2f;
        }

        .header-badge {
            background: #f0f4ff;
            padding: 5px 14px 5px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            color: #007aff;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logo-top {
            display: flex;
            justify-content: center;
            margin: 4px 0 16px;
        }

        .logo-top img {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            object-fit: cover;
            border: 2px solid #f0f4ff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8faff;
            border: 1px solid #eef2f7;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            color: #0a1a2f;
            text-decoration: none;
            margin-bottom: 18px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #f0f4ff;
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .contact-card {
            background: #f8faff;
            border: 1px solid #eef2f7;
            border-radius: 24px;
            padding: 32px 22px;
            text-align: center;
        }

        .contact-card .icon-big {
            font-size: 48px;
            color: #007aff;
            margin-bottom: 12px;
        }

        .contact-card h3 {
            font-size: 22px;
            font-weight: 700;
            color: #0a1a2f;
            margin-bottom: 6px;
        }

        .contact-card .sub {
            font-size: 14px;
            color: #6b7280;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .contact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .contact-grid a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 14px 24px;
            border-radius: 60px;
            text-decoration: none;
            color: #0a1a2f;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }

        .contact-grid a:hover {
            border-color: #007aff;
            background: #f8faff;
        }

        .contact-grid a:active {
            transform: scale(0.96);
        }

        .contact-grid a i {
            font-size: 22px;
        }

        .contact-info {
            margin-top: 20px;
            color: #475569;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .contact-info i {
            color: #007aff;
        }

        .footer {
            text-align: center;
            color: #a0a8b8;
            font-size: 12px;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #f0f2f5;
        }

        @media (max-width: 440px) {
            body { padding: 20px 12px 30px; }
            .container { padding: 20px 14px 20px; }
            .header h1 { font-size: 22px; }
            .logo-top img { width: 52px; height: 52px; }
            .contact-grid a { padding: 12px 18px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Ramaxine.id</h1>
            <span class="header-badge"><i class="fas fa-check-circle"></i> Premium</span>
        </div>

        <div class="logo-top">
            <img src="https://cdn.phototourl.com/free/2026-07-21-4625ad61-03e5-4c4e-9566-0afde713bafa.jpg" alt="Ramaxine">
        </div>

        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>

        <div class="contact-card">
            <div class="icon-big"><i class="fas fa-headset"></i></div>
            <h3>Hubungi Admin</h3>
            <p class="sub">Kami siap membantu Anda 24/7</p>

            <div class="contact-grid">
                <a href="https://wa.me/628815042954" target="_blank">
                    <i class="fab fa-whatsapp" style="color:#25D366;"></i> WhatsApp
                </a>
                <a href="https://t.me/Ramaxine_id" target="_blank">
                    <i class="fab fa-telegram" style="color:#26A5E4;"></i> Telegram
                </a>
            </div>

            <div class="contact-info">
                <i class="fas fa-clock"></i> Support 24/7
            </div>

            <div style="margin-top: 14px; font-weight: 700; color: #0a1a2f; font-size: 14px;">
                © 2026 Ramaxine ID
            </div>
        </div>

        <div class="footer"><i class="fas fa-shield-alt"></i> Aman & Terpercaya</div>

    </div>

</body>
</html>
